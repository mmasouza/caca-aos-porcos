  <circle cx="208" cy="238" r="4" fill="#ffffff"/>
  
  <ellipse cx="312" cy="240" rx="18" ry="24" fill="#ffffff" stroke="#130f40" stroke-width="6"/>
  <circle cx="308" cy="242" r="10" fill="#130f40"/>
  <circle cx="312" cy="238" r="4" fill="#ffffff"/>
  
